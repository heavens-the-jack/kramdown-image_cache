# Docker Compose setup used only for running the tests.
#
# It never touches the host's Ruby environment: it mounts this gem directory
# into the official ruby image and runs the tests in a throwaway container.
# There is no image build step (the official image is used as is), so
# changing the Gemfile does not require rebuilding an image.
#
# Run:
#   ./bin/docker-test                (recommended; passes your UID/GID automatically)
#   docker compose run --rm test     (direct call; see the README for caveats)
services:
  test:
    # Ruby 3.3 by default. To try another version:
    #   TEST_RUBY_VERSION=3.4 bin/docker-test
    image: ruby:${TEST_RUBY_VERSION:-3.3}-slim
    working_dir: /gem
    # Run the container with the host user's UID/GID so that files generated by
    # bundle install (Gemfile.lock, .bundle/) are not owned by root.
    # Set automatically when run through bin/docker-test.
    user: "${DOCKER_TEST_UID:-1000}:${DOCKER_TEST_GID:-1000}"
    environment:
      # Running as an arbitrary UID leaves no /etc/passwd entry, so HOME would
      # be undefined; set it explicitly.
      HOME: /tmp
      # Keep installed gems inside this directory (git-ignored). Placing them on
      # the host bind mount rather than a named volume caches them
      # transparently (later bundle installs are fast).
      BUNDLE_PATH: /gem/.bundle/cache
    volumes:
      - .:/gem
    command: bash -c "bundle install && bundle exec rake test"
